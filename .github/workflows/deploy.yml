name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Prepare Static Deployment
        run: |
          mkdir -p static_deploy

          # Zoek waar de build-bestanden zijn neergezet
          if [ -d ".output/public" ] && [ "$(ls -A .output/public)" ]; then
            cp -r .output/public/* static_deploy/
          elif [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            cp -r dist/* static_deploy/
          elif [ -d ".tanstack" ]; then
            cp -r .tanstack/* static_deploy/
          fi

          # Als er nog steeds geen index.html is, kopieer public inhoud
          if [ -d "public" ]; then
            cp -r public/* static_deploy/
          fi

          # Maak 404 fallback aan voor SPA routing
          [ -f "static_deploy/index.html" ] && cp static_deploy/index.html static_deploy/404.html || true

          # CNAME behouden voor custom domein
          [ -f "CNAME" ] && cp CNAME static_deploy/ || true

          echo "--- Inhoud die geüpload wordt naar GitHub Pages: ---"
          ls -la static_deploy/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: static_deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
